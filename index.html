<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ranges Préflop Cash Game</title>
<meta name="description" content="Ranges préflop pour le cash game en no-limit hold'em / Preflop charts for no-limit hold'em cash games.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Mise en page : colonne « spot » (table + place + action) à côté du verdict et de la grille 13x13 ; entraînement en dessous. */
:root{
  --bg:#e9ece8; --surface:#f8f9f7; --surface-2:#eef1ed; --ink:#141b17; --muted:#5a6760; --line:#d3d9d4;
  --felt:#1d6646; --felt-hi:#2b8058; --rail:#3b2a1e; --felt-ink:#dcefe4; --accent:#1d6646;
  --raise:#c53a2e; --call:#2f8b58; --limp:#b9841a; --allin:#6e2d8c; --fold:#dde2de; --fold-ink:#87938c; --on-act:#ffffff;
  --card:#ffffff; --card-black:#141b17; --card-red:#c53a2e; --chip:#f4f3ee; --focus:#2563eb;
  --f-display:"Barlow Condensed","Arial Narrow",sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0d1310; --surface:#141c18; --surface-2:#1a241f; --ink:#e4ebe6; --muted:#93a29a; --line:#26332c;
    --felt:#174d36; --felt-hi:#21684a; --rail:#2a1d14; --felt-ink:#cfe6d9; --accent:#5fbf8c;
    --raise:#d6534a; --call:#3a9d66; --limp:#c9952a; --allin:#9150ae; --fold:#1c2621; --fold-ink:#5d6c64; --on-act:#ffffff;
    --card:#eef1ee; --card-black:#141b17; --card-red:#c53a2e; --chip:#e8e8e2; --focus:#7aa7ff;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0d1310; --surface:#141c18; --surface-2:#1a241f; --ink:#e4ebe6; --muted:#93a29a; --line:#26332c;
  --felt:#174d36; --felt-hi:#21684a; --rail:#2a1d14; --felt-ink:#cfe6d9; --accent:#5fbf8c;
  --raise:#d6534a; --call:#3a9d66; --limp:#c9952a; --allin:#9150ae; --fold:#1c2621; --fold-ink:#5d6c64; --on-act:#ffffff;
  --card:#eef1ee; --card-black:#141b17; --card-red:#c53a2e; --chip:#e8e8e2; --focus:#7aa7ff;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:22px 48px;display:flex;flex-direction:column;gap:16px}
h1,h2{font-family:var(--f-display);text-wrap:balance;margin:0}
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 32px}
.eyebrow{display:block;font-family:var(--f-display);text-transform:uppercase;letter-spacing:.12em;font-size:13px;font-weight:600;color:var(--accent)}
h1{font-weight:700;font-size:clamp(36px,5.5vw,56px);line-height:.95;letter-spacing:-.01em}
.lede{max-width:50ch;color:var(--muted);margin:0}
.layout{display:grid;grid-template-columns:minmax(0,350px) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:880px){.layout{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.spot{display:flex;flex-direction:column;gap:16px}
.main{display:flex;flex-direction:column;gap:16px;min-width:0}
.label{display:block;font-family:var(--f-display);text-transform:uppercase;letter-spacing:.08em;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:6px}
.seg{display:flex;flex-wrap:wrap;gap:4px}
.btn,.seg button{font-family:var(--f-display);font-weight:600;font-size:15px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);border-radius:6px;padding:6px 10px;cursor:pointer;min-width:36px;line-height:1.2}
.seg button:hover:not(:disabled),.btn:hover{border-color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg button:disabled{opacity:.35;cursor:not-allowed}
.seg.col{flex-direction:column}
.seg.col button{text-align:left;display:flex;justify-content:space-between;gap:8px;font-size:16px;padding:8px 12px}
.seg.col button small{font-family:var(--f-body);font-weight:500;font-size:12px;opacity:.7;align-self:center}
button:focus-visible,input:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

/* table */
.table{position:relative;width:100%;aspect-ratio:16/11}
.felt{position:absolute;inset:15% 13%;border-radius:999px;background:radial-gradient(ellipse at 50% 38%,var(--felt-hi),var(--felt) 72%);border:7px solid var(--rail)}
.pot{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:0 14%;color:var(--felt-ink);font-family:var(--f-display);font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;line-height:1.2}
.seat{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:3px 6px 2px;min-width:50px;font-family:var(--f-display);cursor:pointer;line-height:1.1}
.seat b{font-size:14px;font-weight:700}
.seat small{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);white-space:nowrap}
.seat.out{opacity:.55}
.seat.you{background:var(--ink);color:var(--bg);border-color:var(--ink);opacity:1}
.seat.you small{color:var(--bg);opacity:.75}
.seat.vil{border-color:var(--raise);box-shadow:0 0 0 2px var(--raise);opacity:1}
.seat.vil small{color:var(--raise);font-weight:700}
.dealer{position:absolute;width:18px;height:18px;border-radius:50%;background:var(--chip);color:#151515;border:2px dashed var(--raise);font:700 9px/14px var(--f-display);text-align:center;transform:translate(-50%,-50%);pointer-events:none}

/* main + verdict */
.handrow{display:flex;gap:8px;flex-wrap:wrap}
#hand{flex:1 1 180px;min-width:0;font-family:var(--f-mono);font-size:20px;font-weight:700;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);color:var(--ink)}
.verdict{margin-top:14px;display:flex;flex-direction:column;gap:12px}
.vrow{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.cards{display:flex;gap:6px}
.pcard{width:46px;height:64px;border-radius:6px;background:var(--card);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--f-display);font-weight:700;font-size:24px;line-height:1;color:var(--card-black);box-shadow:0 1px 2px rgba(0,0,0,.15)}
.pcard i{font-style:normal;font-size:20px}
.pcard.red{color:var(--card-red)}
.vact{display:flex;flex-direction:column;gap:4px;min-width:0;flex:1 1 220px}
.pill{align-self:flex-start;font-family:var(--f-display);font-weight:700;font-size:30px;line-height:1;text-transform:uppercase;letter-spacing:.04em;padding:6px 14px;border-radius:6px}
.vsize{color:var(--muted);font-size:14px}
.vsize b{color:var(--ink);font-weight:600}
.hint{margin:0;color:var(--muted)}

/* grille */
.charthead{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 16px;margin-bottom:12px}
.charthead h2{font-size:26px;font-weight:700}
.charthead p{margin:0;color:var(--muted);font-size:14px}
.gridwrap{overflow-x:auto}
.grid{display:grid;grid-template-columns:repeat(13,minmax(0,1fr));gap:2px;max-width:640px;min-width:300px;margin:0 auto}
.cell{aspect-ratio:1;border:0;border-radius:3px;font-family:var(--f-mono);font-size:clamp(7.5px,1.25vw,12px);font-weight:500;display:grid;place-items:center;cursor:pointer;padding:0;line-height:1;position:relative}
.cell:hover{filter:brightness(1.1)}
.cell.sel{outline:3px solid var(--ink);outline-offset:-1px;z-index:1;transform:scale(1.14);box-shadow:0 3px 10px rgba(0,0,0,.35);font-weight:700}
.act-raise{background:var(--raise);color:var(--on-act)}
.act-call{background:var(--call);color:var(--on-act)}
.act-limp{background:var(--limp);color:var(--on-act)}
.act-allin{background:var(--allin);color:var(--on-act)}
.act-fold{background:var(--fold);color:var(--fold-ink)}
.legend{display:flex;flex-wrap:wrap;gap:8px 18px;margin:14px auto 8px;max-width:640px;font-size:14px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:14px;border-radius:3px;display:inline-block}
.legend b{font-variant-numeric:tabular-nums;font-weight:600}
.mixbar{display:flex;height:8px;border-radius:4px;overflow:hidden;max-width:640px;margin:0 auto}
.tip{max-width:640px;margin:14px auto 0;color:var(--muted);font-size:14px}

/* entraînement */
.drillhead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.drillhead h2{font-size:26px}
.score{font-family:var(--f-display);font-size:16px;color:var(--muted);font-variant-numeric:tabular-nums}
.score b{color:var(--ink);font-size:20px}
.dspot{font-family:var(--f-display);font-size:20px;font-weight:600;margin:10px 0 12px}
.drow{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.drow .seg button{font-size:18px;padding:10px 16px}
.feed{min-height:24px;margin-top:12px;font-size:15px}
.feed .ok{color:var(--call);font-weight:600}
.feed .no{color:var(--raise);font-weight:600}
.dfoot{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.notes{color:var(--muted);font-size:13.5px;max-width:80ch}
.notes h2{font-size:18px;color:var(--ink);margin-bottom:4px}
.notes p{margin:0 0 6px}
@media (prefers-reduced-motion: no-preference){.cell{transition:transform .12s ease}}

/* barre d'outils : langue + aide */
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.lang{display:flex;gap:2px;border:1px solid var(--line);border-radius:7px;padding:2px;background:var(--surface-2)}
.lang button{font-family:var(--f-display);font-weight:700;font-size:14px;letter-spacing:.06em;border:0;background:transparent;color:var(--muted);border-radius:5px;padding:5px 9px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.helpbtn{display:inline-flex;align-items:center;gap:6px}
.helpbtn .q{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--ink);color:var(--bg);font-size:12px;font-weight:700}
.topright{display:flex;flex-direction:column;gap:10px;align-items:flex-start;max-width:52ch}
.linkbtn{font:inherit;font-weight:600;color:var(--accent);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:3px}

/* fenêtre d'aide */
dialog.help{width:min(760px,calc(100vw - 32px));max-height:min(88vh,1000px);padding:0;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink)}
dialog.help::backdrop{background:rgba(8,14,11,.6)}
.helphead{position:sticky;top:0;z-index:1;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 20px;background:var(--surface);border-bottom:1px solid var(--line)}
.helphead h2{font-size:28px}
.helpnav{display:flex;flex-wrap:wrap;gap:4px 12px;padding:10px 20px;border-bottom:1px solid var(--line);font-size:14px}
.helpnav a{color:var(--accent);font-weight:600;text-decoration:none}
.helpnav a:hover{text-decoration:underline}
.helpbody{padding:4px 20px 24px}
.helpbody section{padding-top:14px}
.helpbody h3{font-family:var(--f-display);font-size:21px;margin:0 0 6px;scroll-margin-top:70px}
.helpbody p,.helpbody li,.helpbody dd{max-width:68ch}
.helpbody p{margin:0 0 8px}
.helpbody ul,.helpbody ol{margin:0 0 8px;padding-left:20px}
.helpbody li{margin-bottom:4px}
.helpbody dl{margin:0;display:grid;grid-template-columns:minmax(0,170px) minmax(0,1fr);gap:6px 16px}
.helpbody dt{font-weight:600}
.helpbody dd{margin:0;color:var(--muted)}
@media (max-width:560px){.helpbody dl{grid-template-columns:minmax(0,1fr)}.helpbody dd{margin-bottom:6px}}
.helpbody code{font-family:var(--f-mono);font-size:.92em;background:var(--surface-2);border:1px solid var(--line);border-radius:4px;padding:0 4px}
.tablewrap{overflow-x:auto}
.helpbody table{border-collapse:collapse;width:100%;font-size:14px;margin:4px 0 10px}
.helpbody th,.helpbody td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.helpbody th{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.06em;font-size:12px;color:var(--muted)}
.helpbody td:first-child{font-family:var(--f-display);font-weight:700;font-size:16px;white-space:nowrap}
.chip{display:inline-block;padding:0 6px;border-radius:4px;font-weight:600}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <span class="eyebrow" data-i18n="eyebrow"></span>
      <h1 data-i18n="h1"></h1>
    </div>
    <div class="topright">
      <div class="toolbar">
        <div class="lang" id="lang" role="group" aria-label="Langue / Language">
          <button type="button" data-lang="fr" lang="fr">FR</button>
          <button type="button" data-lang="en" lang="en">EN</button>
        </div>
        <button class="btn helpbtn" id="helpOpen" type="button"><span class="q" aria-hidden="true">?</span><span data-i18n="help"></span></button>
      </div>
      <p class="lede"><span data-i18n="lede"></span> <button class="linkbtn" id="helpOpen2" type="button" data-i18n="beginner"></button></p>
    </div>
  </header>

  <main class="layout">
    <section class="panel spot" data-i18n-aria="spotAria">
      <div>
        <span class="label" id="playersLbl" data-i18n="players"></span>
        <div class="seg" id="players" role="group" aria-labelledby="playersLbl"></div>
      </div>
      <div class="table" id="table"></div>
      <div>
        <span class="label" id="seatsLbl" data-i18n="seat"></span>
        <div class="seg" id="seats" role="group" aria-labelledby="seatsLbl"></div>
      </div>
      <div>
        <span class="label" id="sitsLbl" data-i18n="before"></span>
        <div class="seg col" id="sits" role="group" aria-labelledby="sitsLbl"></div>
      </div>
      <div id="vilField">
        <span class="label" id="vilLbl"></span>
        <div class="seg" id="vils" role="group" aria-labelledby="vilLbl"></div>
      </div>
      <div id="sbField">
        <span class="label" id="sbLbl" data-i18n="sbPlan"></span>
        <div class="seg" id="sbplan" role="group" aria-labelledby="sbLbl"></div>
      </div>
    </section>

    <section class="main">
      <div class="panel">
        <label for="hand" class="label" data-i18n="hand"></label>
        <div class="handrow">
          <input id="hand" autocomplete="off" spellcheck="false" placeholder="AKs, QJo, 77, Ah Kd">
          <button class="btn" id="rand" type="button" data-i18n="random"></button>
        </div>
        <div class="verdict" id="verdict" aria-live="polite"></div>
      </div>

      <div class="panel">
        <div class="charthead"><h2 id="chartTitle"></h2><p id="chartSub"></p></div>
        <div class="gridwrap"><div class="grid" id="grid"></div></div>
        <div class="legend" id="legend"></div>
        <div class="mixbar" id="mixbar"></div>
        <p class="tip" id="tip"></p>
      </div>
    </section>
  </main>

  <section class="panel" id="drill" data-i18n-aria="drillTitle">
    <div class="drillhead">
      <div><span class="eyebrow" data-i18n="drillEyebrow"></span><h2 data-i18n="drillTitle"></h2></div>
      <div class="score" id="score"></div>
    </div>
    <div class="dspot" id="dDesc"></div>
    <div class="drow"><div class="cards" id="dCards"></div><div class="seg" id="dBtns"></div></div>
    <div class="feed" id="dFeed" aria-live="polite"></div>
    <div class="dfoot">
      <button class="btn primary" id="dNext" type="button" data-i18n="next"></button>
      <button class="btn" id="dOpen" type="button" data-i18n="openSpot"></button>
    </div>
  </section>

  <footer class="notes">
    <h2 data-i18n="notesTitle"></h2>
    <p data-i18n="notes1"></p>
    <p data-i18n="notes2"></p>
  </footer>
</div>

<dialog class="help" id="help" aria-labelledby="helpTitle">
  <div class="helphead">
    <h2 id="helpTitle" data-i18n="helpTitle"></h2>
    <button class="btn" id="helpClose" type="button" data-i18n="close"></button>
  </div>
  <nav class="helpnav" id="helpNav"></nav>
  <div class="helpbody" id="helpBody"></div>
</dialog>

<script>
const RANKS = "AKQJT98765432";
const ri = c => RANKS.indexOf(c);
const SUIT = { s: "♠", h: "♥", d: "♦", c: "♣" };

// Places dans l'ordre de parole préflop. Deuxième valeur = clé de range : R8 = 8 joueurs derrière (UTG à 9) ... R2 = bouton.
const LAYOUT = {
  2: [["BTN/SB","HU"],["BB","BB"]],
  3: [["BTN","R2"],["SB","SB"],["BB","BB"]],
  4: [["CO","R3"],["BTN","R2"],["SB","SB"],["BB","BB"]],
  5: [["UTG","R4"],["CO","R3"],["BTN","R2"],["SB","SB"],["BB","BB"]],
  6: [["UTG","R5"],["HJ","R4"],["CO","R3"],["BTN","R2"],["SB","SB"],["BB","BB"]],
  7: [["UTG","R6"],["LJ","R5"],["HJ","R4"],["CO","R3"],["BTN","R2"],["SB","SB"],["BB","BB"]],
  8: [["UTG","R7"],["UTG+1","R6"],["LJ","R5"],["HJ","R4"],["CO","R3"],["BTN","R2"],["SB","SB"],["BB","BB"]],
  9: [["UTG","R8"],["UTG+1","R7"],["UTG+2","R6"],["LJ","R5"],["HJ","R4"],["CO","R3"],["BTN","R2"],["SB","SB"],["BB","BB"]],
};
const GROUP = { R8:"EP", R7:"EP", R6:"EP", R5:"MP", R4:"MP", R3:"CO", R2:"BTN", SB:"SB", HU:"HU", BB:"BB" };

/* ---------- ranges ---------- */
const RFI = {
  R8: "55+, A8s+, A5s-A4s, KTs+, QTs+, JTs, T9s, AJo+, KQo",
  R7: "44+, A7s+, A5s-A3s, K9s+, QTs+, JTs, T9s, 98s, AJo+, KQo",
  R6: "33+, A2s+, K9s+, QTs+, JTs, T9s, 98s, 87s, AJo+, KQo",
  R5: "22+, A2s+, K9s+, Q9s+, J9s+, T9s, 98s, 87s, 76s, 65s, ATo+, KQo",
  R4: "22+, A2s+, K7s+, Q9s+, J9s+, T8s+, 97s+, 86s+, 75s+, 65s, 54s, ATo+, KJo+, QJo",
  R3: "22+, A2s+, K4s+, Q7s+, J7s+, T7s+, 96s+, 85s+, 74s+, 64s+, 53s+, A9o+, KTo+, QTo+, JTo",
  R2: "22+, A2s+, K2s+, Q4s+, J6s+, T6s+, 95s+, 85s+, 74s+, 63s+, 53s+, 43s, A2o+, K8o+, Q9o+, J9o+, T9o, 98o",
};
const SB_MIX_RAISE = "66+, A7s+, A5s-A4s, K9s+, QTs+, JTs, A9o+, KJo+";
const SB_MIX_LIMP = "55-22, A6s, A3s-A2s, K2s-K8s, Q2s-Q9s, J4s-J9s, T5s-T9s, 95s-98s, 85s-87s, 74s-76s, 63s-65s, 52s-54s, 42s-43s, 32s, A2o-A8o, K5o-KTo, Q8o-QJo, J8o-JTo, T8o-T9o, 98o, 87o, 76o";
const SB_RAISE_ONLY = "22+, A2s+, K2s+, Q5s+, J7s+, T7s+, 96s+, 86s+, 75s+, 64s+, 54s, A2o+, K8o+, Q9o+, J9o+, T9o";
const HU_RFI = "22+, A2s+, K2s+, Q2s+, J2s+, T2s+, 92s+, 84s+, 73s+, 63s+, 52s+, 42s+, 32s, A2o+, K2o+, Q2o+, J5o+, T6o+, 96o+, 86o+, 75o+, 65o, 54o";

// [3-bet, call]
const VS_RAISE = {
  IP: {
    EP:  ["QQ+, AKs, AKo, A5s-A4s", "JJ-55, AQs-ATs, KQs, KJs, QJs, JTs, T9s, 98s, AQo"],
    MP:  ["QQ+, AQs+, AKo, A5s-A4s, KQs", "JJ-44, AJs-ATs, KJs-KTs, QJs, QTs, JTs, T9s, 98s, 87s, AQo"],
    CO:  ["JJ+, ATs+, KJs+, AQo+, A5s-A3s", "TT-22, A9s-A6s, KTs-K9s, Q9s+, J9s+, T8s+, 98s, 87s, 76s, 65s, AJo, KQo"],

/* ---------- lecture des ranges ---------- */
const sfx = (h, s) => s ? [h + s] : [h + "s", h + "o"];
function expand(tok) {
  tok = tok.trim();
  if (!tok) return [];
  const out = [];
  let plus = false;
  if (tok.endsWith("+")) { plus = true; tok = tok.slice(0, -1); }
  if (tok.includes("-")) {
    const [a, b] = tok.split("-");
    if (a[0] === a[1]) {
      const x = ri(a[0]), y = ri(b[0]);
      for (let k = Math.min(x, y); k <= Math.max(x, y); k++) out.push(RANKS[k] + RANKS[k]);
    } else {
      const x = ri(a[1]), y = ri(b[1]);
      for (let k = Math.min(x, y); k <= Math.max(x, y); k++) out.push(...sfx(a[0] + RANKS[k], a[2] || ""));
    }
    return out;
  }
  if (tok[0] === tok[1]) {
    if (plus) for (let k = 0; k <= ri(tok[0]); k++) out.push(RANKS[k] + RANKS[k]);
    else out.push(tok.slice(0, 2));
    return out;
  }
  if (plus) for (let k = ri(tok[0]) + 1; k <= ri(tok[1]); k++) out.push(...sfx(tok[0] + RANKS[k], tok[2] || ""));
  else out.push(...sfx(tok.slice(0, 2), tok[2] || ""));
  return out;
}
const combos = c => c.length === 2 ? 6 : c[2] === "s" ? 4 : 12;
function cellCode(i, j) {
  if (i === j) return RANKS[i] + RANKS[i];
  return i < j ? RANKS[i] + RANKS[j] + "s" : RANKS[j] + RANKS[i] + "o";
}

const T = () => STR[lang];

/* ---------- spots ---------- */
const SIT_IDS = ["rfi", "limp", "raise", "3bet", "4bet"];
function sitValid(id, hi, n) { return (id === "rfi" || id === "3bet") ? hi < n - 1 : hi > 0; }
function vilOptions(id, hi, n) {
  if (id === "rfi") return [];
  const all = [...Array(n).keys()];
  return id === "3bet" ? all.filter(i => i > hi) : all.filter(i => i < hi);
}

function normalize(st) {
  st.n = Math.min(9, Math.max(2, +st.n || 6));
  const P = LAYOUT[st.n];
  let hi = P.findIndex(p => p[0] === st.hero);
  if (hi < 0) {
    if (st.hero === "BTN/SB" || st.hero === "BTN") hi = st.n === 2 ? 0 : st.n - 3;
    else if (st.hero === "SB") hi = st.n === 2 ? 0 : st.n - 2;
    else if (st.hero === "BB") hi = st.n - 1;
    else hi = 0;
  }
  st.hero = P[hi][0];
  if (!sitValid(st.sit, hi, st.n)) st.sit = SIT_IDS.find(s => sitValid(s, hi, st.n));
  const opts = vilOptions(st.sit, hi, st.n);
  if (!opts.length) st.vil = null;
  else if (!opts.some(i => P[i][0] === st.vil)) st.vil = P[opts[0]][0];
  if (st.sbPlan !== "raise") st.sbPlan = "mix";
  return st;
}

const A = (cls, label, range, size) => ({ cls, label, range, size });
function getChart(st) {
  const L = T();
  const n = st.n, P = LAYOUT[n];
  const hi = P.findIndex(p => p[0] === st.hero);
  const key = P[hi][1];
  const vil = st.vil ? P.find(p => p[0] === st.vil) : null;
  const vkey = vil ? vil[1] : null;
  const tbl = L.table(n);
  const c = { acts: [], rest: A("fold", L.a.fold, "", L.s.fold), title: "", sub: "", tip: "" };

  if (st.sit === "rfi") {
    c.sub = L.sub.rfi(tbl);
    if (key === "HU") {
      c.title = L.ti.hu;
      c.acts = [A("raise", L.a.raise, HU_RFI, L.s.huRaise)];
      c.tip = L.tip.hu;
    } else if (key === "SB") {
      const mix = st.sbPlan === "mix";
      c.title = mix ? L.ti.sbMix : L.ti.sbRaise;
      c.acts = mix
        ? [A("raise", L.a.raise, SB_MIX_RAISE, L.s.sbRaise), A("limp", L.a.limp, SB_MIX_LIMP, L.s.sbLimp)]
        : [A("raise", L.a.raise, SB_RAISE_ONLY, L.s.sbRaise)];
      c.tip = mix ? L.tip.sbMix : L.tip.sbRaise;
    } else {
      c.title = L.ti.open(st.hero);
      c.acts = [A("raise", L.a.raise, RFI[key], L.s.open)];
      c.tip = L.tip.open;
    }
  } else if (st.sit === "limp") {
    c.sub = L.sub.limp(tbl, st.vil);
    if (key === "BB") {
      const vsSB = vkey === "SB" || vkey === "HU";
      c.title = vsSB ? L.ti.bbVsSb : L.ti.bbVsLimp;
      c.acts = [A("raise", L.a.raise, vsSB ? VS_LIMP.BBvsSB[0] : VS_LIMP.BBmulti[0], vsSB ? L.s.bbVsSb : L.s.isoRaise)];
      c.rest = A("limp", L.a.check, "", L.s.check);
      c.tip = vsSB ? L.tip.bbVsSb : L.tip.bbMulti;
    } else if (key === "SB") {
      c.title = L.ti.sbVsLimp;
      c.acts = [A("raise", L.a.raise, VS_LIMP.SB[0], L.s.sbIso), A("limp", L.a.complete, VS_LIMP.SB[1], L.s.complete)];
      c.tip = L.tip.sbLimp;
    } else {
      const r = VS_LIMP[key === "R2" || key === "R3" ? "late" : "early"];
      c.title = L.ti.vsLimp(st.hero);
      c.acts = [A("raise", L.a.iso, r[0], L.s.isoRaise), A("limp", L.a.overlimp, r[1], L.s.overlimp)];
      c.tip = L.tip.vsLimp;
    }
  } else if (st.sit === "raise") {
    const blind = key === "BB" || key === "SB";
    const r = (key === "BB" ? VS_RAISE.BB : key === "SB" ? VS_RAISE.SB : VS_RAISE.IP)[GROUP[vkey]];
    c.sub = L.sub.raise(tbl, st.vil);
    c.title = L.ti.vsOpen(st.hero, st.vil);
    c.acts = [A("raise", L.a.threebet, r[0], blind ? L.s.threeOop : L.s.threeIp), A("call", L.a.call, r[1], key === "BB" ? L.s.callBB : L.s.call)];
    c.tip = key === "BB" ? L.tip.bbDef : key === "SB" ? L.tip.sbDef : L.tip.ipDef;
  } else if (st.sit === "3bet") {
    const r = VS_3BET[GROUP[key]];
    const inPos = key === "HU" || (key !== "SB" && (vkey === "SB" || vkey === "BB"));
    c.title = L.ti.vs3bet(st.hero, st.vil);
    c.sub = L.sub.threebet(tbl, st.vil, inPos);
    c.acts = [A("raise", L.a.fourbet, r[0], L.s.fourbet), A("call", L.a.call, r[1], L.s.call3)];
    c.tip = L.tip.vs3bet(inPos);
  } else if (st.sit === "4bet") {
    const early = GROUP[vkey] === "EP" || GROUP[vkey] === "MP";
    const r = VS_4BET[early ? "early" : "late"];
    c.title = L.ti.vs4bet(st.hero, st.vil);
    c.sub = L.sub.fourbet(tbl, st.vil);
    c.acts = [A("allin", L.a.allin, r[0], L.s.allin), A("call", L.a.call, r[1], L.s.call4)];
    c.tip = early ? L.tip.vs4early : L.tip.vs4late;
  }
  return c;
}
const mapCache = new Map();
function chartMap(c) {
  const k = c.acts.map(a => a.range).join("|");
  if (mapCache.has(k)) return mapCache.get(k);
  const m = {};
  c.acts.forEach((a, i) => a.range.split(",").forEach(t => expand(t).forEach(h => { if (!(h in m)) m[h] = i; })));
  mapCache.set(k, m);
  return m;
}
const actionIndex = (code, c) => { const i = chartMap(c)[code]; return i === undefined ? c.acts.length : i; };
const actionOf = (code, c) => [...c.acts, c.rest][actionIndex(code, c)];

/* ---------- mains ---------- */
function esc(s) { return s.replace(/[&<>"']/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch])); }
function parseHand(raw) {
  const L = T();
  const s = (raw || "").trim().toLowerCase().replace(/10/g, "t").replace(/♠/g, "s").replace(/♥/g, "h").replace(/♦/g, "d").replace(/♣/g, "c").replace(/[\s,\/-]/g, "");
  if (!s) return { codes: [] };
  let m = s.match(/^([akqjt2-9])([shdc])([akqjt2-9])([shdc])$/);
  if (m) {
    let a = [m[1].toUpperCase(), m[2]], b = [m[3].toUpperCase(), m[4]];
    if (a[0] === b[0] && a[1] === b[1]) return { codes: [], err: L.errSame };
    if (ri(b[0]) < ri(a[0])) [a, b] = [b, a];
    const code = a[0] === b[0] ? a[0] + b[0] : a[0] + b[0] + (a[1] === b[1] ? "s" : "o");
    return { codes: [code], cards: [a, b] };
  }
  m = s.match(/^([akqjt2-9])([akqjt2-9])([so])?$/);
  if (m) {
    let r1 = m[1].toUpperCase(), r2 = m[2].toUpperCase();
    if (ri(r2) < ri(r1)) [r1, r2] = [r2, r1];
    if (r1 === r2) return m[3] === "s" ? { codes: [], err: L.errPair } : { codes: [r1 + r2] };
    return { codes: m[3] ? [r1 + r2 + m[3]] : [r1 + r2 + "s", r1 + r2 + "o"] };
  }
  return { codes: [], err: L.errRead(esc(raw.trim())) };
}
function cardsFor(code, exact) {
  if (exact) return exact;
  if (code.length === 2) return [[code[0], "s"], [code[1], "h"]];
  return code[2] === "s" ? [[code[0], "s"], [code[1], "s"]] : [[code[0], "s"], [code[1], "d"]];
}
function cardsHTML(cards, id) {
  return `<div class="cards"${id ? ` id="${id}"` : ""}>${cards.map(([r, s]) => `<span class="pcard${s === "h" || s === "d" ? " red" : ""}" aria-label="${r}${s}">${r === "T" ? "10" : r}<i>${SUIT[s]}</i></span>`).join("")}</div>`;
}
function randomCards() {
  const deck = [];
  for (const r of RANKS) for (const s of "shdc") deck.push([r, s]);
  const i = Math.floor(Math.random() * 52);
  let j; do { j = Math.floor(Math.random() * 52); } while (j === i);
  return [deck[i], deck[j]];
}
// couleurs au hasard qui respectent une classe de main comme "KTs", "KTo" ou "99"
function dealClass(code) {
  const S = "shdc", s1 = S[Math.floor(Math.random() * 4)];
  if (code[2] === "s") return [[code[0], s1], [code[1], s1]];
  let s2; do { s2 = S[Math.floor(Math.random() * 4)]; } while (s2 === s1);
  return [[code[0], s1], [code[1], s2]];
}
function codeOfCards([a, b]) {
  if (ri(b[0]) < ri(a[0])) [a, b] = [b, a];
  return a[0] === b[0] ? a[0] + b[0] : a[0] + b[0] + (a[1] === b[1] ? "s" : "o");
}
const rankName = c => c === "T" ? "10" : c;

/* ---------- état ---------- */
let state = { n: 6, hero: "BTN", sit: "rfi", vil: null, sbPlan: "mix", hand: "AJo" };
try { Object.assign(state, JSON.parse(localStorage.getItem("preflop-state") || "{}")); } catch (e) {}
function save() { try { localStorage.setItem("preflop-state", JSON.stringify(state)); } catch (e) {} }
const $ = id => document.getElementById(id);

function seg(el, items, current, onPick) {
  el.innerHTML = items.map(it => `<button type="button" data-v="${esc(String(it.v))}" aria-pressed="${String(it.v) === String(current)}"${it.disabled ? " disabled" : ""}${it.aria ? ` aria-label="${esc(it.aria)}"` : ""}${it.title ? ` title="${esc(it.title)}"` : ""}>${it.html}</button>`).join("");
  el.onclick = e => { const b = e.target.closest("button"); if (b && !b.disabled) onPick(b.dataset.v); };
}

function seatStatus(i, hi, vi, sit) {
  const S = T().status;
  if (i === hi) return sit === "3bet" ? S.youOpen : sit === "4bet" ? S.you3 : S.you;
  if (i === vi) return S[sit];
  if (sit === "limp") return i < hi ? (i < vi ? S.folded : S.unknown) : S.toAct;
  if (sit === "3bet") return (i < hi || i < vi) ? S.folded : S.toAct;
  if (sit === "4bet") return S.folded;
  return i < hi ? S.folded : S.toAct;
}

function renderTable() {
  const L = T(), n = state.n, P = LAYOUT[n];
  const hi = P.findIndex(p => p[0] === state.hero);
  const vi = state.vil ? P.findIndex(p => p[0] === state.vil) : -1;
  const b = n === 2 ? 0 : n - 3;
  let html = `<div class="felt"><div class="pot">${L.pot[state.sit]}</div></div>`;
  P.forEach((p, i) => {
    const ang = Math.PI / 2 + (i - b) * 2 * Math.PI / n;
    const x = 50 + 45 * Math.cos(ang), y = 50 + 41 * Math.sin(ang);
    const st = seatStatus(i, hi, vi, state.sit);
    const cls = i === hi ? "you" : i === vi ? "vil" : st === L.status.folded ? "out" : "";
    html += `<button type="button" class="seat ${cls}" data-v="${p[0]}" style="left:${x}%;top:${y}%" title="${esc(L.pos[p[0]])}" aria-label="${esc(L.sitAria(p[0]))}"><b>${p[0]}</b><small>${st}</small></button>`;
    if (i === b) {
      const dx = 50 + 31 * Math.cos(ang - 0.38), dy = 50 + 27 * Math.sin(ang - 0.38);
      html += `<span class="dealer" style="left:${dx}%;top:${dy}%">D</span>`;
    }
  });
  const t = $("table");
  t.innerHTML = html;
  t.onclick = e => { const s = e.target.closest(".seat"); if (s) { state.hero = s.dataset.v; update(); } };
}

function renderControls() {
  const L = T(), n = state.n, P = LAYOUT[n];
  const hi = P.findIndex(p => p[0] === state.hero);
  seg($("players"), [2, 3, 4, 5, 6, 7, 8, 9].map(v => ({ v, html: v === 2 ? "HU" : v, aria: L.playersAria(v) })), n, v => { state.n = +v; update(); });
  seg($("seats"), P.map(p => ({ v: p[0], html: p[0], title: L.pos[p[0]] })), state.hero, v => { state.hero = v; update(); });
  seg($("sits"), SIT_IDS.map(id => ({ v: id, html: `${L.sits[id][0]}<small>${L.sits[id][1]}</small>`, disabled: !sitValid(id, hi, n) })), state.sit, v => { state.sit = v; update(); });
  const opts = vilOptions(state.sit, hi, n);
  $("vilField").hidden = !opts.length;
  if (opts.length) {
    $("vilLbl").textContent = L.vil[state.sit];
    seg($("vils"), opts.map(i => ({ v: P[i][0], html: P[i][0], title: L.pos[P[i][0]] })), state.vil, v => { state.vil = v; update(); });
  }
  const sbShow = state.sit === "rfi" && P[hi][1] === "SB";
  $("sbField").hidden = !sbShow;
  if (sbShow) seg($("sbplan"), [{ v: "mix", html: L.sbMix }, { v: "raise", html: L.sbRaise }], state.sbPlan, v => { state.sbPlan = v; update(); });
}

function renderChart() {
  const L = T(), c = getChart(state), m = chartMap(c);
  const sel = new Set(parseHand($("hand").value).codes);
  $("chartTitle").textContent = c.title;
  $("chartSub").textContent = c.sub;
  const all = [...c.acts, c.rest];
  const tally = new Array(all.length).fill(0);
  let html = "";
  for (let i = 0; i < 13; i++) for (let j = 0; j < 13; j++) {
    const code = cellCode(i, j);
    const k = m[code] === undefined ? c.acts.length : m[code];
    tally[k] += combos(code);
    html += `<button type="button" class="cell act-${all[k].cls}${sel.has(code) ? " sel" : ""}" data-h="${code}" title="${code} : ${esc(all[k].label)}">${code}</button>`;
  }
  const g = $("grid");
  g.innerHTML = html;
  g.onclick = e => { const b = e.target.closest(".cell"); if (b) { $("hand").value = b.dataset.h; state.hand = b.dataset.h; renderVerdict(); renderChartSel(); save(); } };
  $("legend").innerHTML = all.map((a, i) => `<span><i class="act-${a.cls}"></i>${a.label} <b>${L.pct(tally[i] / 13.26)}</b></span>`).join("");
  $("mixbar").innerHTML = all.map((a, i) => `<div class="act-${a.cls}" style="width:${tally[i] / 13.26}%"></div>`).join("");
  $("tip").textContent = c.tip;
}
function renderChartSel() {
  const sel = new Set(parseHand($("hand").value).codes);
  document.querySelectorAll("#grid .cell").forEach(el => el.classList.toggle("sel", sel.has(el.dataset.h)));
}

function renderVerdict() {
  const L = T(), p = parseHand($("hand").value), v = $("verdict");
  if (!p.codes.length) { v.innerHTML = `<p class="hint">${p.err || L.handHint}</p>`; return; }
  const c = getChart(state);
  v.innerHTML = p.codes.map(code => {
    const a = actionOf(code, c);
    return `<div class="vrow">${cardsHTML(cardsFor(code, p.cards))}<div class="vact"><span class="vsize">${L.handName(code, rankName)} · ${esc(c.title)}</span><span class="pill act-${a.cls}">${a.label}</span><span class="vsize">${a.size}</span></div></div>`;
  }).join("");
}

function update() {
  normalize(state);
  renderControls();
  renderTable();
  renderChart();
  renderVerdict();
  save();
}

/* ---------- textes statiques et aide ---------- */
function applyLang() {
  const L = T();
  document.documentElement.lang = lang;
  document.title = L.pageTitle;
  document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = L[el.dataset.i18n]; });
  document.querySelectorAll("[data-i18n-aria]").forEach(el => el.setAttribute("aria-label", L[el.dataset.i18nAria]));
  document.querySelectorAll("#lang button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
  $("helpNav").innerHTML = L.helpSections.map(([id, title]) => `<a href="#help-${id}">${title}</a>`).join("");
  $("helpBody").innerHTML = L.helpSections.map(([id, title, html]) => `<section><h3 id="help-${id}">${title}</h3>${html}</section>`).join("");
}
$("lang").addEventListener("click", e => {
  const b = e.target.closest("button[data-lang]");
  if (!b || b.dataset.lang === lang) return;
  lang = b.dataset.lang;
  try { localStorage.setItem("preflop-lang", lang); } catch (e) {}
  applyLang();
  update();
  if (drill) { drill.c = getChart(drill.st); renderDrill(); }
  renderScore();
});

const help = $("help");
function openHelp() { if (typeof help.showModal === "function") help.showModal(); else help.setAttribute("open", ""); $("helpBody").scrollTop = 0; }
function closeHelp() { if (typeof help.close === "function") help.close(); else help.removeAttribute("open"); }
$("helpOpen").addEventListener("click", openHelp);
$("helpOpen2").addEventListener("click", openHelp);
$("helpClose").addEventListener("click", closeHelp);
help.addEventListener("click", e => { if (e.target === help) closeHelp(); });
$("helpNav").addEventListener("click", e => {
  const a = e.target.closest("a");
  if (!a) return;
  e.preventDefault();
  const target = document.getElementById(a.getAttribute("href").slice(1));
  if (target) target.scrollIntoView({ behavior: "smooth", block: "start" });
});

$("hand").value = state.hand || "";
$("hand").addEventListener("input", () => { state.hand = $("hand").value; renderVerdict(); renderChartSel(); save(); });
$("rand").addEventListener("click", () => {
  $("hand").value = randomCards().map(c => c[0] + c[1]).join(" ");
  state.hand = $("hand").value; renderVerdict(); renderChartSel(); save();
});

/* ---------- entraînement ---------- */
let drill = null;
const score = { ok: 0, n: 0, streak: 0 };
function describe(st) {
  const D = T().describe;
  return D.lead(T().table(st.n), st.hero) + D[st.sit](st.vil);
}
function newDrill() {
  const n = 2 + Math.floor(Math.random() * 8), P = LAYOUT[n];
  const hi = Math.floor(Math.random() * n);
  const sits = SIT_IDS.filter(s => sitValid(s, hi, n));
  const weighted = sits.flatMap(s => s === "rfi" || s === "raise" ? [s, s, s] : [s]);
  const sit = weighted[Math.floor(Math.random() * weighted.length)];
  const opts = vilOptions(sit, hi, n);
  const st = normalize({ n, hero: P[hi][0], sit, vil: opts.length ? P[opts[Math.floor(Math.random() * opts.length)]][0] : null, sbPlan: state.sbPlan });
  const c = getChart(st);
  let cards = randomCards();
  if (Math.random() < 0.6) {
    // privilégie les mains jouées, pour éviter un quiz rempli de couches évidentes
    const inPlay = Object.keys(chartMap(c));
    if (inPlay.length) cards = dealClass(inPlay[Math.floor(Math.random() * inPlay.length)]);
  }
  drill = { st, c, code: codeOfCards(cards), cards, pick: null };
  renderDrill();
}
function renderDrill() {
  const L = T(), d = drill, choices = [...d.c.acts, d.c.rest];
  const right = actionIndex(d.code, d.c);
  $("dDesc").textContent = describe(d.st);
  $("dCards").outerHTML = cardsHTML(d.cards, "dCards");
  $("dBtns").innerHTML = choices.map((a, i) => {
    const done = d.pick !== null;
    return `<button type="button" data-i="${i}"${done && i === right ? ' aria-pressed="true"' : ""}${done && i !== right && i !== d.pick ? " disabled" : ""}>${a.label}</button>`;
  }).join("");
  if (d.pick === null) { $("dFeed").innerHTML = ""; return; }
  const r = choices[right];
  $("dFeed").innerHTML = d.pick === right
    ? `<span class="ok">${L.ok}</span> ${L.okLine(d.code, r.label)} ${r.size}`
    : `<span class="no">${L.no}</span> ${L.noLine(d.code, r.label, choices[d.pick].label)} ${r.size}`;
}
$("dBtns").addEventListener("click", e => {
  const b = e.target.closest("button");
  if (!b || !drill || drill.pick !== null) return;
  drill.pick = +b.dataset.i;
  const ok = drill.pick === actionIndex(drill.code, drill.c);
  score.n++; if (ok) { score.ok++; score.streak++; } else score.streak = 0;
  renderDrill();
  renderScore();
});
function renderScore() {
  const L = T();
  $("score").innerHTML = score.n ? L.score(score.ok, score.n, score.streak) : L.scoreEmpty;
}
$("dNext").addEventListener("click", newDrill);
$("dOpen").addEventListener("click", () => {
  if (!drill) return;
  Object.assign(state, drill.st);
  $("hand").value = drill.cards.map(c => c[0] + c[1]).join(" ");
  state.hand = $("hand").value;
  update();
  $("verdict").scrollIntoView({ behavior: "smooth", block: "center" });
});

applyLang();
update();
renderScore();
newDrill();
</script>
</body>
</html>
